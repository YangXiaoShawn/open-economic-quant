[project]
name = "synthetic-payroll-vertical-slice"
fixture_label = "synthetic_fixture"
random_seed = 20260807
timezone = "America/New_York"
date_only_available_time = "23:59:59"
fixture_start = "2017-01-01"
fixture_end = "2025-03-01"
generated_dir = "data/generated"
report_dir = "reports/generated"

[target]
series_id = "PAYEMS"
name = "payems_change_mom_thousands"
frequency = "monthly"
transformation = "difference"
horizon = 0
forecast_day = 25

[backtest]
