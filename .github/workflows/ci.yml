name: Open Economic & Quant Monorepo CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  verify-monorepo:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install oeq-core
        run: python -m pip install -e packages/oeq-core

      - name: Run oeq-core unit tests
        run: python packages/oeq-core/tests/test_oeq_core.py

      - name: Run 8-project contract and AST import hygiene suite
        run: python tests/test_monorepo_contracts.py

      - name: Run factor & post-publication verification suites
        run: |
          python EMFactorTiming/tests/test_published_jkp_results.py
          python PolymarketFactors/tests/test_published_artifacts.py
          python CryptoFactors/tests/test_published_results.py
          python CryptoFactors/tests/test_factor_fixtures.py
          python CryptoFactors/tests/test_postpub_windows.py

      - name: Execute full monorepo verification
        run: make verify-all
