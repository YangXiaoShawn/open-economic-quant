[project]
name = "open-economic-quant"
version = "0.2.0"
description = "Unified monorepo for the eight Open Economic & Quant applied economics and quantitative finance research systems"
readme = "README.md"
# Workspace floor: Macroeconomics, Microstructure and TariffIncidence require
# >=3.12 and RealEstate requires >=3.12,<3.13, so the full workspace (and CI)
# runs on Python 3.12. Individual packages keep their own, possibly looser, bounds.
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Yang Xiao" }]

[tool.uv.workspace]
members = [
  "packages/oeq-core",
  "CasualLab",
  "Macroeconomics",
  "RealEstate",
  "TariffIncidence",
  "Microstructure",
  "EMFactorTiming",
  "PolymarketFactors",
  "CryptoFactors",
]
