name: Open Economic & Quant Monorepo CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  project-tests:
    name: ${{ matrix.project }} tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # CasualLab's chart and Streamlit tests need its dashboard extra.
          - project: CasualLab
            extras: dev,dashboard
          - project: Macroeconomics
            extras: dev
          - project: RealEstate
            extras: dev
          - project: TariffIncidence
            extras: dev
          - project: Microstructure
            extras: dev
          - project: EMFactorTiming
            extras: dev
          - project: PolymarketFactors
            extras: dev
          - project: CryptoFactors
            extras: dev
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            packages/oeq-core/pyproject.toml
            ${{ matrix.project }}/pyproject.toml

      - name: Install ${{ matrix.project }} and the workspace oeq-core
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "${{ matrix.project }}[${{ matrix.extras }}]"
          # Projects pin oeq-core to a published commit for standalone installs;
          # test against this checkout's copy instead.
          python -m pip install --no-deps -e packages/oeq-core

      - name: Run ${{ matrix.project }} pytest suite
        working-directory: ${{ matrix.project }}
        run: python -m pytest

  monorepo-checks:
    name: oeq-core, contracts and sample reproduction
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            packages/oeq-core/pyproject.toml
            PolymarketFactors/pyproject.toml
            CryptoFactors/pyproject.toml

      - name: Install oeq-core and the sample-pipeline projects
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest -e PolymarketFactors -e CryptoFactors
          python -m pip install --no-deps -e packages/oeq-core

      - name: Run oeq-core and monorepo script tests
        run: python -m pytest packages/oeq-core/tests tests

      - name: Execute full monorepo verification
        run: make verify-all PY=python
