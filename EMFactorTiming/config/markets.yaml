# Market classification used to split the sample.
# Source: MSCI market classification (Developed vs. Emerging), as of 2025.
# Codes are lower-case ISO 3166-1 alpha-3, matching the JKP "location" field.
#
# Limitation: this is a STATIC, current classification applied to the whole
# sample. Several countries moved over time (e.g. Israel became Developed in
# 2010; Greece moved to Emerging in 2013). A time-varying map is a planned
# robustness check (see STATUS.md).

