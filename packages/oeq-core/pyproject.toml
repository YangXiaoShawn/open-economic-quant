[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "oeq-core"
version = "0.2.1"
description = "Shared provenance, claim-boundary, and cross-sectional factor primitives for Open Economic & Quant"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Yang Xiao" }]
dependencies = []

[tool.hatch.build.targets.wheel]
packages = ["src/oeq_core"]
